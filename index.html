<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, minimum-scale=1, maximum-scale=1" />
  <title>日本語入力支援アプリ</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="日本語入力" />
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f4f6;
      --surface: #ffffff;
      --text: #111827;
      --muted: #475569;
      --primary: #2563eb;
      --card-radius: 16px;
      --row-cell-h: 44px;
      --row-cell-fs: 1.1rem;
      --kana-cell-fs: 1.3rem;
      --action-h: 50px;
      --action-fs: 0.88rem;
      --display-fs: 30px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
    }

    /* 入力表示欄はコピー可能にする */
    .display-text { user-select: text; -webkit-user-select: text; }

    html {
      height: 100%;
    }

    body {
      height: 100vh; /* fallback */
      height: 100svh; /* iOS Safari 15.4+: small viewport = chrome込みで常に表示される高さ */
      overflow: hidden;
      overscroll-behavior: none;
      width: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      padding: max(6px, env(safe-area-inset-top, 0px)) 6px max(6px, env(safe-area-inset-bottom, 0px));
    }

    /* ── メインコンテナ: 3行グリッド ── */
    .container {
      height: 100%;
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: clamp(3px, 0.85svh, 6px);
      max-width: 960px;
      margin: 0 auto;
      overflow: hidden;
    }

    /* ── カード共通 ── */
    .card {
      background: var(--surface);
      border-radius: var(--card-radius);
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.08);
      padding: clamp(5px, 1.1svh, 8px) 10px;
      display: grid;
      gap: clamp(3px, 0.85svh, 6px);
    }

    .section-title {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--muted);
      line-height: 1;
    }

    /* ── Row 1: 入力エリア ── */
    .display-text {
      font-size: var(--display-fs);
      font-weight: 700;
      line-height: 1.2;
      white-space: pre-wrap;
      word-break: break-word;
      background: #f8fbff;
      border-radius: 10px;
      padding: 6px 10px;
      min-height: clamp(36px, 6.5svh, 46px);
    }

    .status-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 6px;
      align-items: center;
    }

    .status-bar {
      font-size: 0.78rem;
      font-weight: 600;
      color: #1d4ed8;
      background: #eef2ff;
      border-radius: 8px;
      padding: 5px 10px;
    }

    .settings-btn-sm {
      border: none;
      border-radius: 10px;
      background: #f59e0b;
      color: #fff;
      font-size: 0.82rem;
      font-weight: 700;
      padding: 5px 14px;
      min-height: 32px;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.15s;
    }
    .settings-btn-sm:active { opacity: 0.75; }

    /* ── Row 2: 行選択 + 段選択 横並び ── */
    .selection-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: clamp(3px, 0.85svh, 6px);
    }

    .row-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: clamp(3px, 0.7svh, 5px);
    }

    .kana-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: clamp(3px, 0.7svh, 5px);
    }

    .row-cell,
    .kana-cell {
      border: none;
      border-radius: 10px;
      background: #f3f4f6;
      color: var(--text);
      cursor: pointer;
      font-weight: 700;
      font-size: var(--row-cell-fs);
      min-height: var(--row-cell-h);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.07);
      transition: box-shadow 0.15s;
    }

    .kana-cell { font-size: var(--kana-cell-fs); }

    .row-cell.active,
    .kana-cell.active {
      background: rgba(37, 99, 235, 0.12);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
      border: 2px solid var(--primary);
    }

    .row-cell.empty,
    .kana-cell.empty {
      background: transparent;
      box-shadow: none;
      cursor: default;
    }

    .row-cell.mod-key {
      background: #fef3c7;
      color: #92400e;
      font-size: 0.72rem;
      letter-spacing: -0.02em;
    }
    .row-cell.mod-key.active {
      background: rgba(217, 119, 6, 0.2);
      box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.3);
      border: 2px solid #d97706;
    }

    /* ── モードインジケーター（outline内側描画でクリップなし） ── */
    .mode-active {
      outline: 3px solid var(--primary);
      outline-offset: -3px;
      background: rgba(37, 99, 235, 0.05);
    }

    /* ── Row 3: 方向キー（残り全高） ── */
    .pad-card {
      display: flex;
      flex-direction: column;
      gap: clamp(3px, 0.85svh, 6px);
      overflow: hidden;
    }

    .pad-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, minmax(0, 1fr));
      gap: clamp(8px, 2.5svh, 24px);
      min-height: 0;
    }

    .pad-button {
      border: none;
      border-radius: 14px;
      background: #dbeafe;
      color: var(--text);
      cursor: pointer;
      font-size: 1.9rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, transform 0.1s;
    }
    .pad-button:active:not(.confirm-center) {
      background: #bfdbfe;
      transform: scale(0.95);
    }

    /* 確定ボタン（方向キー中央） */
    .pad-button.confirm-center {
      background: var(--primary);
      color: #fff;
      font-size: 1.1rem;
      border-radius: 14px;
    }
    .pad-button.confirm-center:active {
      opacity: 0.8;
      transform: scale(0.95);
    }

    /* ── 操作ボタン行（方向キー下） ── */
    .action-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      flex-shrink: 0;
    }

    .action-btn {
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
      font-size: var(--action-fs);
      min-height: var(--action-h);
      color: #fff;
      transition: opacity 0.15s;
    }
    .action-btn:active { opacity: 0.75; }
    .action-btn.read  { background: var(--primary); }
    .action-btn.del   { background: #f59e0b; }
    .action-btn.undo  { background: #8b5cf6; }
    .action-btn.clear { background: #dc2626; }
    .action-btn.space { background: #64748b; }

    /* ── スキャン入力（入力方式=スキャン時のみ表示） ── */
    .scan-view { display: none; }
    body.scan-mode .selection-row,
    body.scan-mode .pad-card { display: none; }
    body.scan-mode .container { grid-template-rows: auto 1fr; }
    body.scan-mode .scan-view {
      display: flex;
      flex-direction: column;
      gap: clamp(3px, 0.85svh, 6px);
      min-height: 0;
    }
    body:not(.scan-mode) .scan-only { display: none; }

    /* 画面が高い端末ではパネルを大きくして光る項目を見やすくする（行:段:確定 = 3:1.5:3） */
    #scanRowCard  { flex: 3 1 0; grid-template-rows: auto 1fr; }
    #scanKanaCard { flex: 1.5 1 0; grid-template-rows: auto 1fr; }

    .scan-row-grid,
    .scan-kana-grid {
      display: grid;
      gap: clamp(3px, 0.7svh, 5px);
    }
    .scan-row-grid {
      grid-template-columns: repeat(5, 1fr);
      grid-auto-rows: 1fr;
    }
    .scan-kana-grid {
      grid-auto-flow: column;
      grid-auto-columns: 1fr;
      min-height: calc(var(--row-cell-h) * 1.5);
    }

    .scan-cell {
      position: relative;
      overflow: hidden;
      border-radius: 10px;
      background: #f3f4f6;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.07);
      font-weight: 700;
      font-size: max(var(--kana-cell-fs), 4svh);
      line-height: 1.1;
      text-align: center;
      min-height: calc(var(--row-cell-h) * 1.15);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .scan-kana-grid .scan-cell {
      font-size: max(calc(var(--kana-cell-fs) * 1.3), 6svh);
      min-height: calc(var(--row-cell-h) * 1.5);
    }
    .scan-cell.small,
    .scan-kana-grid .scan-cell.small { font-size: min(max(var(--row-cell-fs), 2.6svh), 3.8vw); }
    .scan-cell.back    { background: #e2e8f0; color: var(--muted); }
    .scan-cell.preview { opacity: 0.5; }

    /* 光っている項目: 点滅させず太枠＋背景色で示し、下端のバーで残り時間を示す */
    .scan-cell.on {
      background: #fef9c3;
      box-shadow: inset 0 0 0 5px var(--primary);
    }
    /* 音声確認中の項目 */
    .scan-cell.picked { background: var(--primary); color: #fff; }
    .scan-cell.on::after,
    .scan-cell.picked::after {
      content: '';
      position: absolute;
      left: 9px;
      right: 9px;
      bottom: 9px;
      height: 6px;
      border-radius: 3px;
      background: var(--primary);
      transform-origin: left;
    }
    .scan-cell.picked::after { background: #fff; }
    .scan-cell.on::after,
    .scan-cell.counting::after { animation: scan-bar var(--dur) linear forwards; }
    @keyframes scan-bar {
      from { transform: scaleX(1); }
      to   { transform: scaleX(0); }
    }

    .scan-confirm {
      flex: 3 1 0;
      min-height: 80px;
      border: none;
      border-radius: var(--card-radius);
      background: var(--primary);
      color: #fff;
      font-size: clamp(1.6rem, 5svh, 3rem);
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s, filter 0.1s;
    }
    .scan-confirm.waiting { opacity: 0.4; }
    .scan-confirm.pressed { filter: brightness(0.8); }

    /* ── 設定オーバーレイ ── */
    .settings-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .settings-overlay.open { display: flex; }

    .settings-panel {
      background: var(--surface);
      border-radius: var(--card-radius);
      padding: 20px;
      width: 100%;
      max-width: 460px;
      display: grid;
      gap: 16px;
    }

    .settings-panel h2 {
      font-size: 1rem;
      font-weight: 700;
    }

    .label-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
    }

    label {
      display: grid;
      gap: 6px;
      font-weight: 700;
      font-size: 0.9rem;
    }

    select {
      width: 100%;
      min-height: 44px;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      background: #fff;
      font-size: 0.95rem;
      color: var(--text);
    }

    .close-btn {
      border: none;
      border-radius: 12px;
      background: var(--primary);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      min-height: 50px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- Row 1: 入力エリア -->
    <div class="card">
      <div id="inputTextDisplay" class="display-text"></div>
      <div class="status-row">
        <div id="statusText" class="status-bar">行選択: な行</div>
        <button id="settingsToggleButton" class="settings-btn-sm">設定</button>
      </div>
    </div>

    <!-- Row 2: 行選択 + 段選択 横並び -->
    <div class="selection-row">
      <div class="card" id="rowCard">
        <p class="section-title">行選択</p>
        <div class="row-grid">
          <button class="row-cell" data-row="あ">あ</button>
          <button class="row-cell" data-row="か">か</button>
          <button class="row-cell" data-row="さ">さ</button>
          <button class="row-cell" data-row="た">た</button>
          <button class="row-cell" data-row="な">な</button>
          <button class="row-cell" data-row="は">は</button>
          <button class="row-cell" data-row="ま">ま</button>
          <button class="row-cell" data-row="や">や</button>
          <button class="row-cell" data-row="ら">ら</button>
          <button class="row-cell mod-key" data-row="mod">゛゜小</button>
          <button class="row-cell" data-row="わ">わ</button>
          <button class="row-cell" data-row="sym">記号</button>
        </div>
      </div>

      <div class="card" id="kanaCard">
        <p class="section-title">段選択</p>
        <div class="kana-grid">
          <div    class="kana-cell empty"></div>
          <button class="kana-cell" data-kana="up"     id="kanaUp"></button>
          <div    class="kana-cell empty"></div>
          <button class="kana-cell" data-kana="left"   id="kanaLeft"></button>
          <button class="kana-cell" data-kana="center" id="kanaCenter"></button>
          <button class="kana-cell" data-kana="right"  id="kanaRight"></button>
          <div    class="kana-cell empty"></div>
          <button class="kana-cell" data-kana="down"   id="kanaDown"></button>
          <div    class="kana-cell empty"></div>
        </div>
      </div>
    </div>

    <!-- Row 3: 方向キー（残り全高）+ 操作ボタン -->
    <div class="card pad-card">
      <p class="section-title">方向キー</p>
      <div class="pad-grid">
        <button class="pad-button" data-dir="NW">↖</button>
        <button class="pad-button" data-dir="N" >↑</button>
        <button class="pad-button" data-dir="NE">↗</button>
        <button class="pad-button" data-dir="W" >←</button>
        <button id="confirmButton" class="pad-button confirm-center">確定</button>
        <button class="pad-button" data-dir="E" >→</button>
        <button class="pad-button" data-dir="SW">↙</button>
        <button class="pad-button" data-dir="S" >↓</button>
        <button class="pad-button" data-dir="SE">↘</button>
      </div>
      <div class="action-row">
        <button id="readButton"   class="action-btn read" >読み上げ</button>
        <button id="deleteButton" class="action-btn del"  >削除</button>
        <button id="undoButton"   class="action-btn undo" >↺</button>
        <button id="clearButton"  class="action-btn clear">クリア</button>
        <button id="spaceButton"  class="action-btn space">空白</button>
      </div>
    </div>

    <!-- スキャン入力: 行・段を順に光らせ、確定ボタンを押したタイミングで選ぶ -->
    <div class="scan-view">
      <div class="card" id="scanRowCard">
        <p class="section-title">行選択</p>
        <div class="scan-row-grid" id="scanRowGrid"></div>
      </div>
      <div class="card" id="scanKanaCard">
        <p class="section-title">段選択</p>
        <div class="scan-kana-grid" id="scanKanaGrid"></div>
      </div>
      <button id="scanConfirmButton" class="scan-confirm">確定で開始</button>
    </div>

  </div>

  <!-- 設定オーバーレイ -->
  <div class="settings-overlay" id="settingsOverlay">
    <div class="settings-panel">
      <h2>設定</h2>
      <div class="label-grid">
        <label>
          入力方式
          <select id="inputModeSelect">
            <option value="dpad">方向キー</option>
            <option value="scan">スキャン</option>
          </select>
        </label>
        <label>
          ボタンサイズ
          <select id="buttonSizeSelect">
            <option value="standard">標準</option>
            <option value="large">大</option>
            <option value="xlarge">特大</option>
          </select>
        </label>
        <label>
          文字サイズ
          <select id="textSizeSelect">
            <option value="standard">標準</option>
            <option value="large">大</option>
            <option value="xlarge">特大</option>
          </select>
        </label>
        <label>
          カーソル色
          <select id="highlightColorSelect">
            <option value="#2563eb">青</option>
            <option value="#16a34a">緑</option>
            <option value="#dc2626">赤</option>
            <option value="#d97706">オレンジ</option>
          </select>
        </label>
        <label class="scan-only">
          スキャン間隔
          <select id="scanIntervalSelect"></select>
        </label>
        <label class="scan-only">
          確認待ち時間
          <select id="confirmWaitSelect"></select>
        </label>
        <label class="scan-only">
          連打防止
          <select id="debounceSelect"></select>
        </label>
        <label class="scan-only">
          無操作で停止
          <select id="idleCyclesSelect"></select>
        </label>
      </div>
      <button id="closeSettingsButton" class="close-btn">閉じる</button>
    </div>
  </div>

  <script>
    const STORAGE_INPUT    = 'jp-access-input-text';
    const STORAGE_SETTINGS = 'jp-access-settings';

    const ROW_NAV = {
      'あ':  {NW:'あ',N:'あ',NE:'か',W:'あ',E:'か',SW:'た',S:'た',SE:'な'},
      'か':  {NW:'あ',N:'か',NE:'さ',W:'あ',E:'さ',SW:'な',S:'な',SE:'は'},
      'さ':  {NW:'か',N:'さ',NE:'さ',W:'か',E:'さ',SW:'は',S:'は',SE:'は'},
      'た':  {NW:'あ',N:'あ',NE:'な',W:'た',E:'な',SW:'ま',S:'ま',SE:'や'},
      'な':  {NW:'あ',N:'か',NE:'さ',W:'た',E:'は',SW:'ま',S:'や',SE:'ら'},
      'は':  {NW:'か',N:'さ',NE:'さ',W:'な',E:'は',SW:'や',S:'ら',SE:'ら'},
      'ま':  {NW:'た',N:'た',NE:'や',W:'ま',E:'や',SW:'mod',S:'mod',SE:'わ'},
      'や':  {NW:'な',N:'な',NE:'は',W:'ま',E:'ら',SW:'mod',S:'わ',SE:'sym'},
      'ら':  {NW:'な',N:'は',NE:'は',W:'や',E:'ら',SW:'わ',S:'sym',SE:'sym'},
      'わ':  {NW:'ま',N:'や',NE:'ら',W:'mod',E:'sym',SW:'mod',S:'わ',SE:'sym'},
      'mod': {NW:'ま',N:'ま',NE:'や',W:'mod',E:'わ',SW:'mod',S:'mod',SE:'わ'},
      'sym': {NW:'や',N:'ら',NE:'ら',W:'わ',E:'sym',SW:'わ',S:'sym',SE:'sym'}
    };

    const KANA_MAP = {
      'あ': {center:'あ',left:'い',up:'う',right:'え',down:'お'},
      'か': {center:'か',left:'き',up:'く',right:'け',down:'こ'},
      'さ': {center:'さ',left:'し',up:'す',right:'せ',down:'そ'},
      'た': {center:'た',left:'ち',up:'つ',right:'て',down:'と'},
      'な': {center:'な',left:'に',up:'ぬ',right:'ね',down:'の'},
      'は': {center:'は',left:'ひ',up:'ふ',right:'へ',down:'ほ'},
      'ま': {center:'ま',left:'み',up:'む',right:'め',down:'も'},
      'や': {center:'や',left:'ー',up:'ゆ',right:'ー',down:'よ'},
      'ら': {center:'ら',left:'り',up:'る',right:'れ',down:'ろ'},
      'わ': {center:'わ',left:'を',up:'ん',right:'ー',down:'ー'},
      'sym': {center:'、',left:'。',up:'？',right:'ー',down:'ー'}
    };

    const KANA_NAV = {
      center: {N:'up',S:'down',W:'left',E:'right',NW:'up',NE:'up',SW:'down',SE:'down'},
      up:     {N:'up',S:'center',W:'up',E:'up',NW:'up',NE:'up',SW:'center',SE:'center'},
      down:   {N:'center',S:'down',W:'down',E:'down',NW:'center',NE:'center',SW:'down',SE:'down'},
      left:   {N:'left',S:'left',W:'left',E:'center',NW:'left',NE:'center',SW:'left',SE:'center'},
      right:  {N:'right',S:'right',W:'center',E:'right',NW:'center',NE:'right',SW:'center',SE:'right'}
    };

    const DAKUTEN_MAP = {
      'か':'が','き':'ぎ','く':'ぐ','け':'げ','こ':'ご',
      'さ':'ざ','し':'じ','す':'ず','せ':'ぜ','そ':'ぞ',
      'た':'だ','ち':'ぢ','つ':'づ','て':'で','と':'ど',
      'は':'ば','ひ':'び','ふ':'ぶ','へ':'べ','ほ':'ぼ',
      'う':'ゔ'
    };
    const HANDAKUTEN_MAP = {
      'は':'ぱ','ひ':'ぴ','ふ':'ぷ','へ':'ぺ','ほ':'ぽ'
    };
    const KOGAKI_MAP = {
      'あ':'ぁ','い':'ぃ','う':'ぅ','え':'ぇ','お':'ぉ',
      'つ':'っ','や':'ゃ','ゆ':'ゅ','よ':'ょ','わ':'ゎ'
    };
    const MODIFIER_LABEL = {mod:'゛゜小'};

    const state = {
      mode: 'rowSelection',
      selectedRow: 'な',
      selectedKanaPos: 'center',
      inputText: '',
      settings: {
        inputMode: 'dpad', buttonSize: 'standard', textSize: 'standard', highlightColor: '#2563eb',
        scanInterval: 2, confirmWait: 2, debounce: 0.5, idleCycles: 3
      }
    };

    let lastConfirmedRow = 'な'; // キャンセル用：直前に確定した行を保持

    const container          = document.querySelector('.container');
    const rowCard            = document.getElementById('rowCard');
    const kanaCard           = document.getElementById('kanaCard');
    const inputTextDisplay   = document.getElementById('inputTextDisplay');
    const statusText         = document.getElementById('statusText');
    const undoButton         = document.getElementById('undoButton');
    const rowCells           = Array.from(document.querySelectorAll('.row-cell[data-row]'));
    const kanaCells          = {
      up:     document.getElementById('kanaUp'),
      left:   document.getElementById('kanaLeft'),
      center: document.getElementById('kanaCenter'),
      right:  document.getElementById('kanaRight'),
      down:   document.getElementById('kanaDown')
    };
    const directionButtons     = Array.from(document.querySelectorAll('.pad-button[data-dir]'));
    const confirmButton        = document.getElementById('confirmButton');
    const readButton           = document.getElementById('readButton');
    const deleteButton         = document.getElementById('deleteButton');
    const clearButton          = document.getElementById('clearButton');
    const spaceButton          = document.getElementById('spaceButton');
    const settingsToggleButton = document.getElementById('settingsToggleButton');
    const settingsOverlay      = document.getElementById('settingsOverlay');
    const closeSettingsButton  = document.getElementById('closeSettingsButton');
    const buttonSizeSelect     = document.getElementById('buttonSizeSelect');
    const textSizeSelect       = document.getElementById('textSizeSelect');
    const highlightColorSelect = document.getElementById('highlightColorSelect');
    const inputModeSelect      = document.getElementById('inputModeSelect');
    const scanRowCard          = document.getElementById('scanRowCard');
    const scanKanaCard         = document.getElementById('scanKanaCard');
    const scanRowGrid          = document.getElementById('scanRowGrid');
    const scanKanaGrid         = document.getElementById('scanKanaGrid');
    const scanConfirmButton    = document.getElementById('scanConfirmButton');
    const SCAN_SETTING_SELECTS = [
      [document.getElementById('scanIntervalSelect'), 'scanInterval'],
      [document.getElementById('confirmWaitSelect'),  'confirmWait'],
      [document.getElementById('debounceSelect'),     'debounce'],
      [document.getElementById('idleCyclesSelect'),   'idleCycles']
    ];

    function saveData() {
      localStorage.setItem(STORAGE_INPUT,    state.inputText);
      localStorage.setItem(STORAGE_SETTINGS, JSON.stringify(state.settings));
    }

    function restoreData() {
      const storedText     = localStorage.getItem(STORAGE_INPUT);
      const storedSettings = localStorage.getItem(STORAGE_SETTINGS);
      if (storedText !== null) state.inputText = storedText;
      if (storedSettings) {
        try { Object.assign(state.settings, JSON.parse(storedSettings)); }
        catch (e) { console.warn('設定の復元に失敗', e); }
      }
    }

    function updateUI() {
      const isScan = state.settings.inputMode === 'scan';
      document.body.classList.toggle('scan-mode', isScan);
      inputTextDisplay.textContent = state.inputText || 'ここに入力内容が表示されます。';
      if (isScan) renderScan();
      else updateDpadUI();

      inputModeSelect.value      = state.settings.inputMode;
      buttonSizeSelect.value     = state.settings.buttonSize;
      textSizeSelect.value       = state.settings.textSize;
      highlightColorSelect.value = state.settings.highlightColor;
      SCAN_SETTING_SELECTS.forEach(([select, key]) => { select.value = String(state.settings[key]); });
      applyStyles();
    }

    function updateDpadUI() {
      const isModRow = state.selectedRow in MODIFIER_LABEL;

      rowCard.classList.toggle('mode-active',  state.mode === 'rowSelection');
      kanaCard.classList.toggle('mode-active', state.mode !== 'rowSelection');

      rowCells.forEach((cell) => {
        cell.classList.toggle('active', state.mode === 'rowSelection' && cell.dataset.row === state.selectedRow);
      });

      if (state.mode === 'modSelection') {
        const lastChar = state.inputText.slice(-1);
        const modOptions = {
          center: lastChar,
          left:   DAKUTEN_MAP[lastChar]    || '—',
          up:     HANDAKUTEN_MAP[lastChar] || '—',
          right:  KOGAKI_MAP[lastChar]     || '—',
          down:   lastChar
        };
        Object.entries(kanaCells).forEach(([pos, cell]) => {
          const val = modOptions[pos];
          cell.textContent = val;
          cell.classList.toggle('active', state.selectedKanaPos === pos);
          cell.classList.toggle('empty',  val === '—');
        });
        const sel = modOptions[state.selectedKanaPos];
        statusText.textContent = (state.selectedKanaPos === 'center' || state.selectedKanaPos === 'down' || sel === '—')
          ? `変換なし: 「${lastChar}」のまま`
          : `変換: 「${lastChar}」→「${sel}」`;
      } else if (isModRow && state.mode === 'rowSelection') {
        const lastChar = state.inputText.slice(-1);
        const preview = {
          left:   lastChar ? (DAKUTEN_MAP[lastChar]    || '—') : '゛',
          up:     lastChar ? (HANDAKUTEN_MAP[lastChar] || '—') : '゜',
          right:  lastChar ? (KOGAKI_MAP[lastChar]     || '—') : '小',
          center: lastChar || '—',
          down:   '—'
        };
        Object.entries(kanaCells).forEach(([pos, cell]) => {
          const val = preview[pos];
          cell.textContent = val;
          cell.classList.remove('active');
          cell.classList.toggle('empty', val === '—');
        });
        statusText.textContent = '変換キー選択中: 確定で変換へ';
      } else {
        const kana = KANA_MAP[state.selectedRow] || KANA_MAP['な'];
        Object.entries(kanaCells).forEach(([pos, cell]) => {
          cell.textContent = kana[pos];
          cell.classList.toggle('active', state.mode !== 'rowSelection' && state.selectedKanaPos === pos);
          cell.classList.remove('empty');
        });
        statusText.textContent = state.mode === 'rowSelection'
          ? (state.selectedRow === 'sym' ? '行選択: 「記号」' : `行選択: 「${state.selectedRow}」行`)
          : `段選択: 「${KANA_MAP[state.selectedRow][state.selectedKanaPos]}」`;
      }
    }

    function applyStyles() {
      const root = document.documentElement;
      root.style.setProperty('--primary', state.settings.highlightColor);

      const svh = window.innerHeight * 0.01;
      const bs = state.settings.buttonSize;
      const maxCellH   = bs === 'xlarge' ? 58 : bs === 'large' ? 52 : 44;
      const maxActionH = bs === 'xlarge' ? 58 : bs === 'large' ? 54 : 50;
      const cellScale   = bs === 'xlarge' ? 7.5 : bs === 'large' ? 6.3 : 5.3;
      const actionScale = bs === 'xlarge' ? 7.5 : bs === 'large' ? 7.0 : 6.5;
      root.style.setProperty('--row-cell-h', Math.min(maxCellH, cellScale * svh).toFixed(1) + 'px');
      root.style.setProperty('--action-h',   Math.min(maxActionH, actionScale * svh).toFixed(1) + 'px');

      const ts = state.settings.textSize;
      root.style.setProperty('--display-fs',   ts === 'xlarge' ? '38px'   : ts === 'large' ? '32px'   : '26px');
      root.style.setProperty('--row-cell-fs',  ts === 'xlarge' ? '1.3rem' : ts === 'large' ? '1.15rem': '1rem');
      root.style.setProperty('--kana-cell-fs', ts === 'xlarge' ? '1.55rem': ts === 'large' ? '1.4rem' : '1.25rem');
      root.style.setProperty('--action-fs',    ts === 'xlarge' ? '1rem'   : ts === 'large' ? '0.92rem': '0.82rem');
    }

    function moveRow(dir) {
      state.selectedRow = ROW_NAV[state.selectedRow][dir] || state.selectedRow;
      state.mode = 'rowSelection';
      updateUI();
    }

    function moveKana(dir) {
      state.selectedKanaPos = KANA_NAV[state.selectedKanaPos][dir] || state.selectedKanaPos;
      updateUI();
    }

    function handleDirection(dir) {
      if (state.mode === 'rowSelection') moveRow(dir);
      else moveKana(dir);
    }

    function confirmSelection() {
      if (state.mode === 'rowSelection') {
        const row = state.selectedRow;
        if (row === 'mod') {
          if (state.inputText.length === 0) return;
          state.mode = 'modSelection';
          state.selectedKanaPos = 'center';
        } else {
          state.mode = 'kanaSelection';
          state.selectedKanaPos = 'center';
        }
      } else if (state.mode === 'kanaSelection') {
        lastConfirmedRow = state.selectedRow;
        state.inputText += KANA_MAP[state.selectedRow][state.selectedKanaPos];
        state.mode = 'rowSelection';
        state.selectedRow = 'な';
        state.selectedKanaPos = 'center';
        saveData();
      } else if (state.mode === 'modSelection') {
        const lastChar = state.inputText.slice(-1);
        let converted;
        if (state.selectedKanaPos === 'left')  converted = DAKUTEN_MAP[lastChar];
        else if (state.selectedKanaPos === 'up')    converted = HANDAKUTEN_MAP[lastChar];
        else if (state.selectedKanaPos === 'right') converted = KOGAKI_MAP[lastChar];
        if (converted) {
          state.inputText = state.inputText.slice(0, -1) + converted;
          saveData();
        }
        state.mode = 'rowSelection';
        state.selectedRow = 'な';
        state.selectedKanaPos = 'center';
      }
      updateUI();
    }

    function setRowSelection(row)  { state.selectedRow = row;  state.mode = 'rowSelection';  updateUI(); }

    function handleKanaClick(pos) {
      if (state.mode === 'modSelection' || state.selectedRow === 'mod') {
        if (state.inputText.length === 0) return;
        const lastChar = state.inputText.slice(-1);
        let converted;
        if (pos === 'left')       converted = DAKUTEN_MAP[lastChar];
        else if (pos === 'up')    converted = HANDAKUTEN_MAP[lastChar];
        else if (pos === 'right') converted = KOGAKI_MAP[lastChar];
        if (converted) {
          state.inputText = state.inputText.slice(0, -1) + converted;
          saveData();
        }
      } else {
        const kana = KANA_MAP[state.selectedRow];
        if (!kana) return;
        const char = kana[pos];
        if (!char || char === 'ー') return;
        lastConfirmedRow = state.selectedRow;
        state.inputText += char;
        saveData();
      }
      state.mode = 'rowSelection';
      state.selectedRow = 'な';
      state.selectedKanaPos = 'center';
      updateUI();
    }

    function readAloud() {
      const text = state.inputText.trim();
      if (!text) return;
      if (!window.speechSynthesis) { alert('このブラウザは読み上げをサポートしていません。'); return; }
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ja-JP';
      utterance.rate = 1;
      window.speechSynthesis.speak(utterance);
    }

    function deleteChar() {
      state.inputText = state.inputText.slice(0, -1);
      saveData();
      updateUI();
    }
    function clearText() {
      state.inputText = '';
      state.selectedRow = 'な';
      state.selectedKanaPos = 'center';
      state.mode = 'rowSelection';
      saveData();
      updateUI();
    }
    function insertSpace() {
      state.inputText += ' ';
      saveData();
      updateUI();
    }
    function cancelAction() {
      if (state.mode === 'modSelection' || state.mode === 'kanaSelection') {
        state.mode = 'rowSelection';
        state.selectedRow = 'な';
        state.selectedKanaPos = 'center';
      } else {
        if (state.inputText.length === 0) return;
        state.inputText = state.inputText.slice(0, -1);
        state.mode = 'kanaSelection';
        state.selectedRow = lastConfirmedRow;
        state.selectedKanaPos = 'center';
        saveData();
      }
      updateUI();
    }
    function toggleSettings() {
      const open = settingsOverlay.classList.toggle('open');
      if (open) scanIdle(false);
      // 外部スイッチの Space/Enter で閉じるボタン等が押されないようにフォーカスを外す
      else if (document.activeElement) document.activeElement.blur();
    }

    /* ── スキャン入力 ──
       行→段の候補を順に光らせ、確定ボタンを押したタイミングで選ぶ。
       選んだ後は音声で確認し、確認待ち時間内にもう一度押すと決定、押さなければ取り消す。 */
    const SCAN_ROWS = [
      ...['あ', 'か', 'さ', 'た', 'な', 'は', 'ま', 'や', 'ら', 'わ'].map((k) => ({ key: k, label: k, speak: k + '行' })),
      { key: 'mod',  label: '゛゜小', speak: '変換' },
      { key: 'sym',  label: '記号',   speak: '記号' },
      { key: 'func', label: '機能',   speak: '機能' }
    ];
    const SCAN_KANA = {
      'あ': 'あいうえお', 'か': 'かきくけこ', 'さ': 'さしすせそ', 'た': 'たちつてと', 'な': 'なにぬねの',
      'は': 'はひふへほ', 'ま': 'まみむめも', 'や': 'やゆよ',     'ら': 'らりるれろ', 'わ': 'わをんー',
      'sym': '、。？'
    };
    // 1文字だけでは聞き取りにくい・読まれない文字の読み方
    const SPEAK_NAME  = { 'ー': 'のばし棒', '、': '読点', '。': '句点', '？': 'はてな', 'ゔ': 'ヴ' };
    const KOGAKI_BASE = Object.fromEntries(Object.entries(KOGAKI_MAP).map(([k, v]) => [v, k]));
    const SCAN_BACK   = { label: '戻る', speak: '戻る' };

    const scan = {
      phase: 'idle',   // idle / row / rowConfirm / kana / kanaConfirm
      paused: false,   // 無操作で止まったか
      index: 0,        // 光っている項目
      cycles: 0,       // 押されずに回った周回数
      rowIndex: 0,     // 選んだ行
      items: [],       // 段の候補
      ready: false,    // 確認の音声が終わり、決定を受け付けているか
      timer: null,
      gen: 0,          // 古い音声コールバックを無効にするための世代番号
      lastPress: 0
    };

    const scanRowCells = SCAN_ROWS.map((row) => {
      const cell = document.createElement('div');
      cell.className = 'scan-cell';
      cell.classList.toggle('small', row.label.length >= 3);
      cell.textContent = row.label;
      scanRowGrid.appendChild(cell);
      return cell;
    });

    function fillOptions(select, values, format) {
      select.replaceChildren(...values.map((v) => new Option(format(v), String(v))));
    }
    const formatSec = (v) => v.toFixed(1) + '秒';
    fillOptions(SCAN_SETTING_SELECTS[0][0], [1, 1.5, 2, 2.5, 3, 3.5, 4], formatSec);
    fillOptions(SCAN_SETTING_SELECTS[1][0], [1, 1.5, 2, 2.5, 3, 3.5, 4, 4.5, 5], formatSec);
    fillOptions(SCAN_SETTING_SELECTS[2][0], [0.3, 0.5, 0.7, 1], formatSec);
    fillOptions(SCAN_SETTING_SELECTS[3][0], [2, 3, 4, 5, 0], (v) => (v ? v + '周' : 'しない'));

    function speakName(ch) {
      return SPEAK_NAME[ch] || (KOGAKI_BASE[ch] ? '小さい' + KOGAKI_BASE[ch] : ch);
    }

    function modCandidates() {
      const lastChar = state.inputText.slice(-1);
      return [DAKUTEN_MAP[lastChar], HANDAKUTEN_MAP[lastChar], KOGAKI_MAP[lastChar]].filter(Boolean);
    }

    function appendChar(ch) {
      state.inputText += ch;
      saveData();
    }
    function replaceLastChar(ch) {
      state.inputText = state.inputText.slice(0, -1) + ch;
      saveData();
    }

    function scanItemsFor(key) {
      if (key === 'func') {
        return [
          { label: '読み上げ', speak: '読み上げ', run: readAloud },
          { label: '削除',     speak: '削除',     run: deleteChar },
          { label: '空白',     speak: '空白',     run: insertSpace },
          { label: 'クリア',   speak: 'クリア',   run: clearText }
        ];
      }
      if (key === 'mod') {
        return modCandidates().map((ch) => ({ label: ch, speak: speakName(ch), run: () => replaceLastChar(ch) }));
      }
      return [...SCAN_KANA[key]].map((ch) => ({ label: ch, speak: speakName(ch), run: () => appendChar(ch) }));
    }

    function speak(text, onEnd) {
      let done = false;
      const finish = () => {
        if (done) return;
        done = true;
        clearTimeout(fallback);
        if (onEnd) onEnd();
      };
      const fallback = setTimeout(finish, 5000); // onend が届かない環境への保険
      if (!window.speechSynthesis) { finish(); return; }
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ja-JP';
      utterance.rate = 1;
      utterance.onend = finish;
      utterance.onerror = finish;
      window.speechSynthesis.speak(utterance);
    }

    function scanStop() {
      clearTimeout(scan.timer);
      scan.gen += 1;
    }

    function scanIdle(paused) {
      scanStop();
      scan.phase = 'idle';
      scan.paused = paused;
      updateUI();
    }

    function scanRun(phase, index) {
      scanStop();
      scan.phase = phase;
      scan.index = index;
      scan.cycles = 0;
      scan.ready = false;
      scanStep();
    }

    function scanStep() {
      updateUI();
      scan.timer = setTimeout(() => {
        const list = scan.phase === 'row' ? SCAN_ROWS : scan.items;
        scan.index += 1;
        if (scan.index >= list.length) {
          scan.index = 0;
          scan.cycles += 1;
          if (state.settings.idleCycles && scan.cycles >= state.settings.idleCycles) {
            scanIdle(true);
            return;
          }
        }
        scanStep();
      }, state.settings.scanInterval * 1000);
    }

    function scanConfirm(phase, name) {
      scanStop();
      scan.phase = phase;
      scan.ready = false;
      updateUI();
      const gen = scan.gen;
      speak(name + '、ですね？', () => {
        if (gen !== scan.gen) return;
        scan.ready = true;
        updateUI();
        // 時間内に押されなければ取り消し、1つ前の項目から再開する（押し遅れで隣を選んだ場合にすぐ戻れる）
        scan.timer = setTimeout(() => {
          scanRun(phase === 'rowConfirm' ? 'row' : 'kana', Math.max(0, scan.index - 1));
        }, state.settings.confirmWait * 1000);
      });
    }

    function scanPress() {
      const confirming = scan.phase.endsWith('Confirm');
      if (confirming && !scan.ready) return; // 確認の音声中は受け付けない
      const now = Date.now();
      if (now - scan.lastPress < state.settings.debounce * 1000) return; // 震えによる2度押しを無視
      scan.lastPress = now;
      scanConfirmButton.classList.add('pressed');
      setTimeout(() => scanConfirmButton.classList.remove('pressed'), 150);

      if (scan.phase === 'idle') {
        scanRun('row', 0);
      } else if (scan.phase === 'row') {
        const row = SCAN_ROWS[scan.index];
        if (row.key === 'mod' && modCandidates().length === 0) {
          speak('変換できる文字がありません');
          return;
        }
        scanConfirm('rowConfirm', row.speak);
      } else if (scan.phase === 'kana') {
        scanConfirm('kanaConfirm', scan.items[scan.index].speak);
      } else if (scan.phase === 'rowConfirm') {
        scan.rowIndex = scan.index;
        scan.items = [...scanItemsFor(SCAN_ROWS[scan.index].key), SCAN_BACK];
        scanRun('kana', 0);
      } else {
        const item = scan.items[scan.index];
        if (item === SCAN_BACK) {
          scanRun('row', Math.max(0, scan.rowIndex - 1));
        } else {
          item.run();
          scanRun('row', 0);
        }
      }
    }

    function markCell(cell, marks, dur) {
      cell.classList.remove('on', 'picked', 'counting');
      if (!marks) return;
      cell.style.setProperty('--dur', dur + 's');
      void cell.offsetWidth; // 残り時間バーのアニメーションを最初から始める
      cell.classList.add(...marks.split(' '));
    }

    function renderScan() {
      const inRow      = scan.phase === 'row'  || scan.phase === 'rowConfirm';
      const inKana     = scan.phase === 'kana' || scan.phase === 'kanaConfirm';
      const confirming = scan.phase.endsWith('Confirm');
      const marks = !confirming ? 'on' : scan.ready ? 'picked counting' : 'picked';
      const dur   = confirming ? state.settings.confirmWait : state.settings.scanInterval;

      scanRowCard.classList.toggle('mode-active', inRow);
      scanKanaCard.classList.toggle('mode-active', inKana);
      scanRowCells.forEach((cell, i) => markCell(cell, inRow && i === scan.index ? marks : '', dur));

      // 行スキャン中は、光っている行の文字を段パネルにプレビュー表示する
      const row = SCAN_ROWS[inKana ? scan.rowIndex : scan.index];
      const items = inKana ? scan.items : inRow ? scanItemsFor(row.key) : [];
      if (inRow && items.length === 0) items.push({ label: '—' });
      scanKanaGrid.replaceChildren(...items.map((item) => {
        const cell = document.createElement('div');
        cell.className = 'scan-cell';
        cell.classList.toggle('small', item.label.length >= 2);
        cell.classList.toggle('back', item === SCAN_BACK);
        cell.classList.toggle('preview', inRow);
        cell.textContent = item.label;
        return cell;
      }));
      if (inKana) markCell(scanKanaGrid.children[scan.index], marks, dur);

      const item = inKana ? scan.items[scan.index] : null;
      if (scan.phase === 'idle') {
        statusText.textContent = scan.paused ? '一時停止中: 確定ボタンで再開' : '確定ボタンを押すと始まります';
      } else if (scan.phase === 'row') {
        statusText.textContent = `行選択: 「${row.speak}」`;
      } else if (scan.phase === 'kana') {
        statusText.textContent = `段選択（${row.speak}）: 「${item.label}」`;
      } else {
        const name = inRow ? row.speak : item.label;
        statusText.textContent = `「${name}」ですね？` + (scan.ready ? ' 確定で決定' : '');
      }
      scanConfirmButton.textContent = scan.phase !== 'idle' ? '確定' : scan.paused ? '確定で再開' : '確定で開始';
      scanConfirmButton.classList.toggle('waiting', confirming && !scan.ready);
    }

    rowCells.forEach((cell) => cell.addEventListener('click', () => setRowSelection(cell.dataset.row)));
    Object.entries(kanaCells).forEach(([pos, cell]) => {
      cell.addEventListener('click', () => handleKanaClick(pos));
    });
    directionButtons.forEach((btn) => btn.addEventListener('click', () => handleDirection(btn.dataset.dir)));
    confirmButton.addEventListener('click', confirmSelection);
    readButton.addEventListener('click', readAloud);
    deleteButton.addEventListener('click', deleteChar);
    undoButton.addEventListener('click', cancelAction);
    clearButton.addEventListener('click', clearText);
    spaceButton.addEventListener('click', insertSpace);
    settingsToggleButton.addEventListener('click', toggleSettings);
    closeSettingsButton.addEventListener('click', toggleSettings);
    settingsOverlay.addEventListener('click', (e) => { if (e.target === settingsOverlay) toggleSettings(); });

    buttonSizeSelect.addEventListener('change', (e) => { state.settings.buttonSize = e.target.value; saveData(); applyStyles(); });
    textSizeSelect.addEventListener('change',   (e) => { state.settings.textSize   = e.target.value; saveData(); applyStyles(); });
    highlightColorSelect.addEventListener('change', (e) => { state.settings.highlightColor = e.target.value; saveData(); updateUI(); });
    inputModeSelect.addEventListener('change', (e) => { state.settings.inputMode = e.target.value; saveData(); scanIdle(false); });
    SCAN_SETTING_SELECTS.forEach(([select, key]) => {
      select.addEventListener('change', (e) => { state.settings[key] = Number(e.target.value); saveData(); });
    });

    /* スキャンの確定は指が触れた瞬間に反応させる（click は指が動くと発火しないことがある） */
    scanConfirmButton.addEventListener('pointerdown', (e) => { e.preventDefault(); scanPress(); });

    /* 外部スイッチ（キーボードとして Space / Enter を送るもの）でも確定できる */
    document.addEventListener('keydown', (e) => {
      if (state.settings.inputMode !== 'scan' || settingsOverlay.classList.contains('open')) return;
      if (e.key !== ' ' && e.key !== 'Enter') return;
      e.preventDefault();
      if (!e.repeat) scanPress();
    });

    /* アプリが裏に回ったらスキャンを止める */
    document.addEventListener('visibilitychange', () => { if (document.hidden) scanIdle(false); });

    /* iOS は最初の音声をユーザー操作の中で鳴らす必要があるため、最初のタッチで音声を有効にしておく */
    function unlockSpeech() {
      document.removeEventListener('touchend', unlockSpeech);
      document.removeEventListener('click', unlockSpeech);
      if (window.speechSynthesis) window.speechSynthesis.speak(new SpeechSynthesisUtterance(' '));
    }
    document.addEventListener('touchend', unlockSpeech);
    document.addEventListener('click', unlockSpeech);

    /* Chromeのホバーメニュー（コピー・検索・翻訳等）を抑制 */
    document.addEventListener('contextmenu', (e) => e.preventDefault());
    document.addEventListener('selectstart', (e) => {
      if (!e.target.closest('.display-text')) e.preventDefault();
    });

    /* 拡大縮小・パンニング・スワイプを無効化 */
    /* iOS SafariはViewportのuser-scalable=noを無視するためJSでも制御する */
    function onTouchMove(e)      { e.preventDefault(); }
    function onTouchStartMulti(e){ if (e.touches.length > 1) e.preventDefault(); }
    function onGesture(e)        { e.preventDefault(); }
    document.addEventListener('touchmove',     onTouchMove,       { passive: false });
    document.addEventListener('touchstart',    onTouchStartMulti, { passive: false });
    document.addEventListener('gesturestart',  onGesture,         { passive: false });
    document.addEventListener('gesturechange', onGesture,         { passive: false });

    /* ダブルタップ・ダブルクリックをシングル操作に読み替え */
    let lastTouchEnd = 0;
    function onTouchEnd(e) {
      const now = Date.now();
      if (now - lastTouchEnd < 350) e.preventDefault();
      lastTouchEnd = now;
    }
    function onDblClick(e) { e.preventDefault(); }
    document.addEventListener('touchend', onTouchEnd, { passive: false });
    document.addEventListener('dblclick', onDblClick);

    /* アプリ終了時にイベントリスナーを解除して元の状態に戻す */
    window.addEventListener('beforeunload', () => {
      document.removeEventListener('touchmove',     onTouchMove);
      document.removeEventListener('touchstart',    onTouchStartMulti);
      document.removeEventListener('gesturestart',  onGesture);
      document.removeEventListener('gesturechange', onGesture);
      document.removeEventListener('touchend',      onTouchEnd);
      document.removeEventListener('dblclick',      onDblClick);
    });

    window.addEventListener('resize', applyStyles);

    restoreData();
    updateUI();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js'); });
    }
  </script>
</body>
</html>
